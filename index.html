<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>릴스 메모</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111214">
<style>
  :root {
    --bg: #111214; --panel: #1b1d21; --line: #2a2d33; --text: #f2f2f3; --muted: #9a9ca3;
    --accent: #ff4d6d; --accent-ink: #fff; --ok: #3ecf8e; --warn: #f5b84a; --err: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f6f7; --panel: #fff; --line: #e3e4e8; --text: #16171a; --muted: #6b6e76; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; padding: 10px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  header button { flex: 1; padding: 8px; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); font: inherit; font-weight: 600; }
  header button[aria-selected="true"] { background: var(--panel); color: var(--text); }
  header button.icon { flex: 0 0 44px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); color: var(--text); font: inherit; }
  textarea { resize: vertical; min-height: 96px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
    color: var(--muted); font: inherit; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .primary { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 17px; }
  .primary:disabled { opacity: .5; }
  .status { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.err { color: var(--err); }
  .card { padding: 12px 14px; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .card .meta a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .card .memo { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .card .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tags span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .card.pending { border-style: dashed; }
  .empty { margin-top: 32px; text-align: center; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header role="tablist">
  <button role="tab" data-view="save" aria-selected="true">저장</button>
  <button role="tab" data-view="list" aria-selected="false">목록</button>
  <button role="tab" data-view="set" aria-selected="false" class="icon" aria-label="설정">⚙</button>
</header>

<main>
  <section id="v-save">
    <label for="url">링크</label>
    <input id="url" type="url" inputmode="url" placeholder="인스타에서 공유하면 자동으로 들어가요">
    <label for="memo">메모</label>
    <textarea id="memo" placeholder="뭐가 좋았어? 한 줄이면 충분"></textarea>
    <div class="chips" id="chips"></div>
    <button class="primary" id="saveBtn">저장</button>
    <p class="status" id="status"></p>
  </section>

  <section id="v-list" hidden>
    <input id="q" type="search" placeholder="메모·태그 검색">
    <div id="list"></div>
  </section>

  <section id="v-set" hidden>
    <label for="cfgEndpoint">구글 시트 연결 주소 (Apps Script 웹 앱 URL)</label>
    <input id="cfgEndpoint" type="url" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="cfgKey">비밀키</label>
    <input id="cfgKey" type="text" autocomplete="off" placeholder="Apps Script에 적은 것과 똑같이">
    <label for="cfgTags">빠른 태그 (쉼표로 구분, 비워도 됨)</label>
    <input id="cfgTags" type="text">
    <button class="primary" id="cfgSave">설정 저장 + 연결 테스트</button>
    <p class="status" id="cfgStatus"></p>
    <p class="hint" id="queueInfo"></p>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const DEFAULT_TAGS = ['훅', '썸네일', '편집', '자막', '구성', '음악', '톤'];
let cfg = store.get('cfg', { endpoint: '', key: '', tags: DEFAULT_TAGS });
let selected = new Set();
let openedByShare = false;

// ---------- 화면 전환 ----------
function show(view) {
  document.querySelectorAll('header [role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.view === view));
  ['save', 'list', 'set'].forEach(v => $('#v-' + v).hidden = v !== view);
  if (view === 'list') loadList();
  if (view === 'set') fillSettings();
}
document.querySelectorAll('header [role=tab]').forEach(b => b.onclick = () => show(b.dataset.view));

// ---------- 링크 정리 ----------
function cleanUrl(u) {
  try {
    const x = new URL(u);
    if (x.hostname.endsWith('instagram.com')) {
      x.hostname = 'www.instagram.com';
      x.search = ''; x.hash = '';
      x.pathname = x.pathname.replace(/^\/reels\//, '/reel/');
    }
    return x.toString();
  } catch { return u; }
}
function extractUrl(...parts) {
  const m = parts.filter(Boolean).join(' ').match(/https?:\/\/[^\s"'<>]+/);
  return m ? cleanUrl(m[0]) : '';
}

// ---------- 태그 칩 ----------
function renderChips() {
  const box = $('#chips');
  box.innerHTML = '';
  (cfg.tags || []).forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = t;
    b.setAttribute('aria-pressed', selected.has(t));
    b.onclick = () => { selected.has(t) ? selected.delete(t) : selected.add(t); b.setAttribute('aria-pressed', selected.has(t)); };
    box.appendChild(b);
  });
}

// ---------- 저장 / 전송 ----------
function setStatus(el, msg, kind = '') { el.textContent = msg; el.className = 'status ' + kind; }

async function api(method, payload) {
  if (method === 'GET') {
    const r = await fetch(cfg.endpoint + '?key=' + encodeURIComponent(cfg.key));
    return r.json();
  }
  // text/plain이어야 브라우저가 사전 요청(CORS preflight)을 보내지 않아 Apps Script가 받을 수 있음
  const r = await fetch(cfg.endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ key: cfg.key, ...payload }),
  });
  return r.json();
}

// 대기열에 있는 항목을 순서대로 시트에 보냄. 실패하면 폰에 남겨 두고 다음에 다시 시도.
let flushing = null;
function flush() {
  if (!flushing) flushing = (async () => {
    if (!cfg.endpoint) return { ok: false, reason: 'nocfg' };
    const q = store.get('queue', []);
    while (q.length) {
      try {
        const res = await api('POST', { action: 'add', item: q[0] });
        if (!res.ok) return { ok: false, reason: res.error || 'fail' };
      } catch { return { ok: false, reason: 'network' }; }
      q.shift(); store.set('queue', q);
    }
    return { ok: true };
  })().finally(() => { flushing = null; });
  return flushing;
}

async function save() {
  const url = $('#url').value.trim();
  const memo = $('#memo').value.trim();
  const st = $('#status');
  if (!url && !memo) return setStatus(st, '링크나 메모 중 하나는 있어야 해요', 'err');

  const item = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    ts: new Date().toISOString(),
    url: url ? cleanUrl(url) : '', memo, tags: [...selected],
  };
  const q = store.get('queue', []); q.push(item); store.set('queue', q);

  $('#url').value = ''; $('#memo').value = ''; selected.clear(); renderChips();
  $('#saveBtn').disabled = true;
  setStatus(st, '저장 중…');
  const res = await flush();
  $('#saveBtn').disabled = false;

  if (res.ok) {
    setStatus(st, '저장했어요 ✓', 'ok');
    if (openedByShare) setTimeout(() => window.close(), 700);
  } else if (res.reason === 'nocfg') {
    setStatus(st, '폰에 임시 보관했어요. ⚙ 설정에서 시트를 연결하면 옮겨져요', 'warn');
  } else if (res.reason === 'unauthorized') {
    setStatus(st, '비밀키가 안 맞아요. ⚙ 설정을 확인해 주세요 (폰에 보관 중)', 'err');
  } else {
    setStatus(st, '인터넷이 불안정해서 폰에 보관했어요. 다음에 열 때 자동으로 보내요', 'warn');
  }
}
$('#saveBtn').onclick = save;
// 메모는 짧게 쓰니까 엔터 = 저장
$('#memo').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); save(); }
});

// ---------- 목록 ----------
let listCache = store.get('list', []);
function fmtDate(ts) {
  const d = new Date(ts);
  return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function renderList() {
  const term = $('#q').value.trim().toLowerCase();
  const pending = store.get('queue', []).map(i => ({ ...i, pending: true })).reverse();
  const items = [...pending, ...listCache].filter(i =>
    !term || (i.memo + ' ' + (i.tags || []).join(' ')).toLowerCase().includes(term));
  const box = $('#list');
  box.innerHTML = '';
  if (!items.length) { box.innerHTML = `<p class="empty">${term ? '검색 결과가 없어요' : '아직 저장한 릴스가 없어요'}</p>`; return; }
  for (const i of items) {
    const c = document.createElement('div');
    c.className = 'card' + (i.pending ? ' pending' : '');
    const meta = document.createElement('div'); meta.className = 'meta';
    const when = document.createElement('span'); when.textContent = fmtDate(i.ts) + (i.pending ? ' · 전송 대기' : '');
    meta.appendChild(when);
    if (i.url) { const a = document.createElement('a'); a.href = i.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '열기 ↗'; meta.appendChild(a); }
    c.appendChild(meta);
    if (i.memo) { const m = document.createElement('div'); m.className = 'memo'; m.textContent = i.memo; c.appendChild(m); }
    if (i.tags && i.tags.length) {
      const t = document.createElement('div'); t.className = 'tags';
      i.tags.forEach(x => { const s = document.createElement('span'); s.textContent = x; t.appendChild(s); });
      c.appendChild(t);
    }
    box.appendChild(c);
  }
}
async function loadList() {
  renderList();
  if (!cfg.endpoint) return;
  try {
    await flush();
    const res = await api('GET');
    if (res.ok) { listCache = res.items; store.set('list', listCache); renderList(); }
  } catch {}
}
$('#q').addEventListener('input', renderList);

// ---------- 설정 ----------
function fillSettings() {
  $('#cfgEndpoint').value = cfg.endpoint || '';
  $('#cfgKey').value = cfg.key || '';
  $('#cfgTags').value = (cfg.tags || []).join(', ');
  const n = store.get('queue', []).length;
  $('#queueInfo').textContent = n ? `시트로 아직 못 보낸 메모 ${n}개가 폰에 있어요.` : '';
}
$('#cfgSave').onclick = async () => {
  cfg = {
    endpoint: $('#cfgEndpoint').value.trim(),
    key: $('#cfgKey').value.trim(),
    tags: $('#cfgTags').value.split(',').map(s => s.trim()).filter(Boolean),
  };
  store.set('cfg', cfg);
  renderChips();
  const st = $('#cfgStatus');
  if (!cfg.endpoint) return setStatus(st, '저장했어요 (시트 연결 안 함)', 'warn');
  setStatus(st, '연결 확인 중…');
  try {
    const res = await api('GET');
    if (!res.ok) return setStatus(st, res.error === 'unauthorized' ? '비밀키가 안 맞아요' : '연결 실패: ' + res.error, 'err');
    const f = await flush();
    setStatus(st, `연결됐어요 ✓ (시트에 ${res.items.length}개)` + (f.ok ? '' : ' · 대기 메모 전송 실패'), f.ok ? 'ok' : 'warn');
    fillSettings();
  } catch {
    setStatus(st, '연결 실패. 주소가 /exec로 끝나는지, 액세스가 "모든 사용자"인지 확인해 주세요', 'err');
  }
};

// ---------- 시작 ----------
(function init() {
  // 설정 링크(#setup=...)로 열면 시트 주소·비밀키를 자동으로 넣음. # 뒤는 서버로 전송되지 않음.
  const setup = location.hash.match(/^#setup=(.+)$/);
  if (setup) {
    try {
      const s = JSON.parse(decodeURIComponent(setup[1]));
      cfg = { ...cfg, endpoint: s.endpoint || '', key: s.key || '' };
      store.set('cfg', cfg);
    } catch {}
    history.replaceState(null, '', location.pathname);
  }
  const p = new URLSearchParams(location.search);
  const shared = extractUrl(p.get('url'), p.get('text'), p.get('title'));
  if (p.has('share') || shared) {
    openedByShare = true;
    $('#url').value = shared;
    history.replaceState(null, '', location.pathname);
  }
  renderChips();
  if (!cfg.endpoint) show('set');
  else setTimeout(() => $('#memo').focus(), 50);
  flush();
  window.addEventListener('online', flush);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
